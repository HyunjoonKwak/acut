[package]
name = "acut"
version = "0.3.3"
description = "에이컷 - 사진을 고르고 정리해 NAS로 올리는 컬링 스테이션"
authors = ["에이컷"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Image processing
image = "0.25"
kamadak-exif = "0.5"

# Hashing
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Configuration

# Scheduling

# Pattern matching
glob = "0.3"

# Parallelism
rayon = "1.10"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# File system
walkdir = "2.5"
# 폴더 감시 — 파인더로 넣은 사진이 앱에 나타난다 (2단계)
notify = "7.0"

# Platform (macOS)
libc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Text
unicode-normalization = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
# 가져오기 시험에서 «찍은 날»을 못으로 박는다 — EXIF가 없으면 수정시각이 쓰인다
filetime = "0.2"
