# cargo audit 이 알려 주는 것 가운데, 우리가 지금 손쓸 수 없고 실제 위험도 낮다고
# 판단한 항목만 여기 적는다. **판단은 반드시 근거와 함께 적는다** — 그래야 다음
# 사람이 다시 따져 볼 수 있고, 목록이 조용히 길어지지 않는다.
#
# 새로 생긴 취약점은 여기 없으므로 릴리스 문지기에 걸린다. 그것이 이 파일의 목적이다.
# 마지막 검토: 2026-09-01

[advisories]
ignore = [
    # quick-xml — plist 1.8 이 쓰고, 그것을 tauri 가 끌어온다. 우리가 직접 올릴 수
    # 없다(plist 상위 판이 나와야 한다). 파싱 대상은 우리 앱이 만든 Info.plist 뿐이라
    # 바깥에서 온 XML 을 읽는 자리가 없다. tauri 가 올라가면 함께 풀린다.
    "RUSTSEC-2026-0195", # 이름공간 선언 무제한 할당 (메모리 고갈)
    "RUSTSEC-2026-0194", # 여는 태그 중복 속성 검사가 제곱 시간

    # rkyv 0.7 — Cargo.lock 에는 있지만 `cargo tree -i rkyv` 가 비어 있다.
    # 어느 크레이트의 선택 기능으로 잠금 파일에만 남았고 실제 빌드에는 들어가지 않는다.
    "RUSTSEC-2026-0235", # Rc/Arc 를 담은 아카이브에서 범위 밖 읽기
]
