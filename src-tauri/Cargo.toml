[package]
name = "acut"
version = "0.5.4"
description = "에이컷 - 사진을 고르고 정리해 NAS로 올리는 컬링 스테이션"
authors = ["에이컷"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Image processing
image = "0.25"
kamadak-exif = "0.5"

# Hashing
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Configuration

# Scheduling

# Pattern matching
glob = "0.3"

# Parallelism
rayon = "1.10"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# File system
walkdir = "2.5"
# 폴더 감시 — 파인더로 넣은 사진이 앱에 나타난다 (2단계)
notify = "7.0"

# Platform (macOS)
libc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Text
unicode-normalization = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
# 로컬 AI — ONNX Runtime. download-binaries가 빌드 때 정적 라이브러리를 받아 온다.
# coreml은 애플 실리콘의 신경엔진·GPU를 쓴다.
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "coreml", "ndarray"] }
ndarray = "0.16"
# 글로 찾기 — BERT WordPiece 토크나이저. onig(C) 대신 fancy-regex.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
futures-util = "0.3"
thiserror = "2.0"
# 긴 일 동안 App Nap을 막는다 (NSProcessInfo beginActivity). tauri가 이미 같은 판을 쓴다.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSObjCRuntime"] }

[dev-dependencies]
tempfile = "3"
# 가져오기 시험에서 «찍은 날»을 못으로 박는다 — EXIF가 없으면 수정시각이 쓰인다
filetime = "0.2"

# 개발 빌드에서도 의존 라이브러리는 최적화한다.
# 그림 디코딩(image)이 디버그로 돌면 AI 벡터 만들기가 초당 20장이었다 —
# 최적화된 벤치는 96장. 우리 코드만 디버그로 두고 나머지는 -O3.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
